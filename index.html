<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityBuilder Pro: Ultra Graphics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --c-bittersweet: #FF5A5E;
            --c-indigo: #3F51B5;
            --c-slate: #7C4DFF;
            --c-hot-pink: #FF80AB;
            --c-pale-pink: #F8BBD0;
            --c-violet: #6A1B9A;
            --bg-dark: #1a1a2e;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: radial-gradient(circle at center, #2e2e42 0%, #1a1a2e 100%);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            user-select: none;
        }

        /* --- UI GLASSMORPHISM --- */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 16px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            height: 95vh;
            margin: auto 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mobile Responsive Sidebar */
        @media (max-width: 1024px) {
            .sidebar {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                max-height: 40vh;
                margin: 0;
                border-radius: 20px 20px 0 0;
                background: rgba(20, 20, 35, 0.95);
            }
            .hide-mobile { display: none; }
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--c-indigo) 0%, var(--c-slate) 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(63, 81, 181, 0.3);
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(63, 81, 181, 0.4); }
        .btn:active { transform: translateY(1px); }

        .btn-red { background: linear-gradient(135deg, var(--c-bittersweet) 0%, #D32F2F 100%); box-shadow: 0 4px 15px rgba(255, 90, 94, 0.3); }
        
        /* Asset Grid */
        .asset-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .asset-card:hover { background: rgba(255,255,255,0.1); border-color: var(--c-slate); }
        .asset-card.active {
            background: rgba(124, 77, 255, 0.2);
            border-color: var(--c-slate);
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.2);
            transform: scale(0.98);
        }

        /* Canvas Area */
        .game-area {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        .game-area:active { cursor: grabbing; }

        canvas { display: block; width: 100%; height: 100%; }

        /* Floating Stats */
        .stat-pill {
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 50;
        }
    </style>
</head>
<body>

    <div id="loginModal" class="modal-overlay">
        <div class="glass p-8 text-center max-w-sm w-full mx-4 border-t-4 border-[#7C4DFF]">
            <h1 class="text-4xl font-black mb-2 bg-gradient-to-r from-[#FF5A5E] to-[#7C4DFF] bg-clip-text text-transparent">NEO CITY</h1>
            <p class="text-xs font-bold text-gray-400 tracking-widest mb-8">ADVANCED SIMULATOR</p>
            
            <input type="text" id="username" placeholder="ENTER MAYOR NAME" class="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-center font-bold text-white mb-4 focus:outline-none focus:border-[#7C4DFF] transition">
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="startGame(false)" class="btn">LOAD CITY</button>
                <button onclick="startGame(true)" class="btn btn-red">NEW CITY</button>
            </div>
        </div>
    </div>

    <aside class="sidebar glass">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
            <div>
                <h2 class="text-xl font-black text-white">CONTROLS</h2>
                <div class="text-[10px] text-[#FF5A5E] font-bold mt-1">MAYOR: <span id="uiUser" class="text-white">GUEST</span></div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-400 font-bold">WEEK</div>
                <div class="text-3xl font-black text-[#7C4DFF]" id="uiTurn">1</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="glass p-3 flex flex-col items-center">
                <i class="fas fa-coins text-[#FF5A5E] mb-1"></i>
                <div class="text-[10px] font-bold opacity-60">FUNDS</div>
                <div class="text-lg font-bold">₹<span id="uiMoney">0</span></div>
            </div>
            <div class="glass p-3 flex flex-col items-center">
                <i class="fas fa-users text-[#3F51B5] mb-1"></i>
                <div class="text-[10px] font-bold opacity-60">POPULATION</div>
                <div class="text-lg font-bold" id="uiPop">0</div>
            </div>
        </div>

        <div class="flex justify-between mb-6 px-2">
            <div class="stat-pill"><i class="fas fa-smile text-[#FF80AB]"></i> <span id="uiHappy">50</span>%</div>
            <div class="stat-pill"><i class="fas fa-bolt text-[#FF5A5E]"></i> <span id="uiPower">0</span></div>
            <div class="stat-pill"><i class="fas fa-tint text-[#7C4DFF]"></i> <span id="uiWater">0</span></div>
        </div>

        <div class="flex-1 overflow-y-auto mb-4 pr-1 scrollbar-hide">
            <div class="text-[10px] font-bold opacity-50 mb-2 tracking-widest">BUILDINGS</div>
            <div id="toolGrid" class="grid grid-cols-3 gap-2">
                </div>
        </div>

        <div class="grid grid-cols-1 gap-2 mt-auto">
            <button onclick="nextTurn()" class="btn w-full py-4 text-base relative overflow-hidden group">
                <span class="relative z-10">NEXT WEEK (INCOME)</span>
                <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition duration-300"></div>
            </button>
        </div>
    </aside>

    <main class="game-area">
        <canvas id="gameCanvas"></canvas>
        
        <div id="toastContainer" class="absolute top-10 left-1/2 -translate-x-1/2 flex flex-col gap-2 pointer-events-none w-64"></div>
        
        <div class="absolute bottom-6 right-6 flex gap-2">
            <button onclick="resetCamera()" class="glass w-12 h-12 rounded-full flex items-center justify-center hover:bg-white/10 transition active:scale-90">
                <i class="fas fa-crosshairs"></i>
            </button>
            <button onclick="document.getElementById('helpModal').classList.remove('hidden')" class="glass w-12 h-12 rounded-full flex items-center justify-center hover:bg-white/10 transition active:scale-90">
                <i class="fas fa-question"></i>
            </button>
        </div>
    </main>

    <div id="helpModal" class="modal-overlay hidden">
        <div class="glass p-6 max-w-sm w-full mx-4 text-left">
            <h3 class="text-xl font-bold text-[#7C4DFF] mb-4">HOW TO PLAY</h3>
            <ul class="text-sm space-y-3 text-gray-300 mb-6">
                <li><i class="fas fa-mouse text-[#FF5A5E] w-6"></i> Drag to move map.</li>
                <li><i class="fas fa-hammer text-[#3F51B5] w-6"></i> Select tool & click grid to build.</li>
                <li><i class="fas fa-bolt text-[#FF5A5E] w-6"></i> Power is needed for Houses.</li>
                <li><i class="fas fa-industry text-[#6A1B9A] w-6"></i> Factories make money.</li>
            </ul>
            <button onclick="document.getElementById('helpModal').classList.add('hidden')" class="btn w-full">PLAY</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const GRID_SIZE = 24;
        const TILE_WIDTH = 64;  // Isometric Tile Width
        const TILE_HEIGHT = 32; // Isometric Tile Height
        
        // ** COLOR PALETTE (Your Request) **
        const PALETTE = {
            bittersweet: '#FF5A5E',
            indigo: '#3F51B5',
            slate: '#7C4DFF',
            hotPink: '#FF80AB',
            palePink: '#F8BBD0',
            violet: '#6A1B9A',
            road: '#546E7A',
            grass: '#2E2E42' // Dark theme grass
        };

        const BUILDINGS = {
            house:   { name: 'House',   cost: 100,  h: 12, color: PALETTE.palePink,    icon: 'fa-home', pop: 4, income: 5 },
            apt:     { name: 'Apt',     cost: 300,  h: 35, color: PALETTE.indigo,      icon: 'fa-building', pop: 12, income: 20 },
            power:   { name: 'Power',   cost: 500,  h: 20, color: PALETTE.bittersweet, icon: 'fa-bolt', power: 50 },
            water:   { name: 'Water',   cost: 400,  h: 25, color: PALETTE.slate,       icon: 'fa-tint', water: 50 },
            mall:    { name: 'Mall',    cost: 2000, h: 40, color: PALETTE.hotPink,     icon: 'fa-shopping-bag', income: 150, happy: 10 },
            factory: { name: 'Factory', cost: 1000, h: 25, color: PALETTE.violet,      icon: 'fa-industry', income: 80, happy: -10 },
            road:    { name: 'Road',    cost: 20,   h: 2,  color: PALETTE.road,        icon: 'fa-road' },
            park:    { name: 'Park',    cost: 150,  h: 5,  color: '#00E676',           icon: 'fa-tree', happy: 15 }
        };

        // --- 2. ENGINE STATE ---
        let state = {
            money: 5000,
            turn: 1,
            pop: 0,
            happy: 50,
            grid: [],
            camera: { x: 0, y: 100 } // Calculated on init
        };
        
        let tool = null; // Current selected tool
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let gameId = 'guest';
        let hoveredTile = { x: -1, y: -1 };
        
        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization

        // --- 3. CORE FUNCTIONS ---

        function initGame() {
            // Resize Canvas to fit screen
            resize();
            window.addEventListener('resize', resize);
            
            // Generate Tools UI
            const grid = document.getElementById('toolGrid');
            grid.innerHTML = '';
            
            // Add Buildings
            Object.keys(BUILDINGS).forEach(key => {
                const b = BUILDINGS[key];
                const btn = document.createElement('div');
                btn.className = 'asset-card';
                btn.innerHTML = `
                    <i class="fas ${b.icon} text-xl mb-1" style="color:${b.color}"></i>
                    <div class="text-[9px] font-bold opacity-70">${b.name}</div>
                    <div class="text-[9px] font-bold text-[#FF5A5E]">₹${b.cost}</div>
                `;
                btn.onclick = () => selectTool(key, btn);
                grid.appendChild(btn);
            });

            // Add Demolish
            const delBtn = document.createElement('div');
            delBtn.className = 'asset-card border-red-500/50';
            delBtn.innerHTML = `<i class="fas fa-trash text-red-500 text-xl mb-1"></i><div class="text-[9px] font-bold text-red-400">REMOVE</div>`;
            delBtn.onclick = () => selectTool('DELETE', delBtn);
            grid.appendChild(delBtn);

            // Start Loop
            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            // Center Camera
            state.camera.x = canvas.width / 2;
            state.camera.y = 150;
        }

        function startGame(isNew) {
            const name = document.getElementById('username').value.trim() || 'GUEST';
            gameId = name;
            document.getElementById('uiUser').innerText = name;
            document.getElementById('loginModal').classList.add('hidden');

            if(isNew) {
                state.grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
                // Starter Pack
                const m = Math.floor(GRID_SIZE/2);
                state.grid[m][m] = { type: 'house' };
                state.grid[m+1][m] = { type: 'road' };
                state.grid[m][m+1] = { type: 'road' };
                state.money = 5000;
                notify('Welcome Mayor!', 'text-[#7C4DFF]');
            } else {
                loadGame();
            }
            
            initGame();
            updateUI();
        }

        // --- 4. RENDER ENGINE (The "Advanced" Graphics) ---
        
        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        function draw() {
            // 1. Clear & Background Gradient
            // Gradient is set in CSS, so just clear rect
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. Render Tiles (Back to Front)
            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    const pos = isoToScreen(x, y);
                    
                    // Culling (Performance)
                    if(pos.x < -100 || pos.x > canvas.width+100 || pos.y < -100 || pos.y > canvas.height+100) continue;

                    // Draw Tile
                    drawTile(x, y, pos.x, pos.y);
                }
            }

            // 3. Draw Hover Selection
            if(hoveredTile.x >= 0 && hoveredTile.x < GRID_SIZE && hoveredTile.y >= 0 && hoveredTile.y < GRID_SIZE) {
                const pos = isoToScreen(hoveredTile.x, hoveredTile.y);
                drawCursor(pos.x, pos.y);
            }
        }

        function drawTile(x, y, sx, sy) {
            // Base Ground (Dark Aesthetic)
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + TILE_WIDTH/2, sy + TILE_HEIGHT/2);
            ctx.lineTo(sx, sy + TILE_HEIGHT);
            ctx.lineTo(sx - TILE_WIDTH/2, sy + TILE_HEIGHT/2);
            ctx.closePath();
            
            // Checkerboard Effect
            ctx.fillStyle = (x+y)%2 === 0 ? '#26263a' : '#2a2a40'; 
            ctx.fill();

            // Object
            const cell = state.grid[x][y];
            if(cell) {
                const b = BUILDINGS[cell.type];
                if(b) drawBlock(sx, sy, b.color, b.h);
            } 
            // Ghost Preview
            else if(tool && tool !== 'DELETE' && x === hoveredTile.x && y === hoveredTile.y) {
                const b = BUILDINGS[tool];
                ctx.globalAlpha = 0.5;
                drawBlock(sx, sy, b.color, b.h);
                ctx.globalAlpha = 1.0;
            }
        }

        function drawBlock(ox, oy, color, h) {
            const topY = oy - h;
            
            // ** 3D PRISM LOGIC **
            
            // Right Face (Shadow)
            ctx.fillStyle = adjustColor(color, -60);
            ctx.beginPath();
            ctx.moveTo(ox, oy + TILE_HEIGHT);
            ctx.lineTo(ox + TILE_WIDTH/2, oy + TILE_HEIGHT/2);
            ctx.lineTo(ox + TILE_WIDTH/2, topY + TILE_HEIGHT/2);
            ctx.lineTo(ox, topY + TILE_HEIGHT);
            ctx.fill();

            // Left Face (Mid-tone)
            ctx.fillStyle = adjustColor(color, -30);
            ctx.beginPath();
            ctx.moveTo(ox, oy + TILE_HEIGHT);
            ctx.lineTo(ox - TILE_WIDTH/2, oy + TILE_HEIGHT/2);
            ctx.lineTo(ox - TILE_WIDTH/2, topY + TILE_HEIGHT/2);
            ctx.lineTo(ox, topY + TILE_HEIGHT);
            ctx.fill();

            // Top Face (Brightest - Gradient)
            // Create gradient for "Shiny" look
            const grad = ctx.createLinearGradient(ox - TILE_WIDTH/2, topY, ox + TILE_WIDTH/2, topY + TILE_HEIGHT);
            grad.addColorStop(0, color);
            grad.addColorStop(1, adjustColor(color, -20));
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(ox, topY);
            ctx.lineTo(ox + TILE_WIDTH/2, topY + TILE_HEIGHT/2);
            ctx.lineTo(ox, topY + TILE_HEIGHT);
            ctx.lineTo(ox - TILE_WIDTH/2, topY + TILE_HEIGHT/2);
            ctx.fill();

            // Highlight Edge (Smoothness)
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawCursor(sx, sy) {
            ctx.strokeStyle = tool === 'DELETE' ? '#FF5A5E' : 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + TILE_WIDTH/2, sy + TILE_HEIGHT/2);
            ctx.lineTo(sx, sy + TILE_HEIGHT);
            ctx.lineTo(sx - TILE_WIDTH/2, sy + TILE_HEIGHT/2);
            ctx.closePath();
            ctx.stroke();
        }

        // --- 5. MATH & UTILS ---

        function isoToScreen(x, y) {
            return {
                x: (x - y) * TILE_WIDTH * 0.5 + state.camera.x,
                y: (x + y) * TILE_HEIGHT * 0.5 + state.camera.y
            };
        }

        function screenToIso(sx, sy) {
            const adjX = sx - state.camera.x;
            const adjY = sy - state.camera.y;
            const gy = (adjY / (TILE_HEIGHT * 0.5) - adjX / (TILE_WIDTH * 0.5)) / 2;
            const gx = (adjY / (TILE_HEIGHT * 0.5) + adjX / (TILE_WIDTH * 0.5)) / 2;
            return { x: Math.floor(gx), y: Math.floor(gy) };
        }

        function adjustColor(hex, amount) {
            return '#' + hex.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        // --- 6. INTERACTION & LOGIC ---

        function selectTool(key, el) {
            tool = key;
            document.querySelectorAll('.asset-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        // Canvas Events
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }

        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = getPos(e); });
        canvas.addEventListener('mousemove', e => {
            const p = getPos(e);
            if(isDragging) {
                state.camera.x += (p.x - lastMouse.x);
                state.camera.y += (p.y - lastMouse.y);
            } else {
                hoveredTile = screenToIso(p.x, p.y);
            }
            lastMouse = p;
        });
        canvas.addEventListener('mouseup', e => {
            isDragging = false;
            if(!tool) return; // Only move camera if no tool
            if(Math.abs(getPos(e).x - lastMouse.x) < 5) { // Click detection
                handleClick(hoveredTile.x, hoveredTile.y);
            }
        });
        // Mobile
        canvas.addEventListener('touchstart', e => { isDragging = true; lastMouse = getPos(e); }, {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = getPos(e); if(isDragging) { state.camera.x += (p.x - lastMouse.x); state.camera.y += (p.y - lastMouse.y); } lastMouse = p; }, {passive: false});
        canvas.addEventListener('touchend', e => { isDragging = false; handleClick(hoveredTile.x, hoveredTile.y); });


        function handleClick(x, y) {
            if(x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;

            // Delete
            if(tool === 'DELETE') {
                if(state.grid[x][y]) {
                    state.grid[x][y] = null;
                    state.money += 25;
                    notify("DEMOLISHED +₹25", "text-[#FF5A5E]");
                    updateUI(); saveGame();
                }
                return;
            }

            // Build
            if(state.grid[x][y]) { notify("BLOCKED", "text-red-400"); return; }
            
            const b = BUILDINGS[tool];
            if(state.money >= b.cost) {
                state.money -= b.cost;
                state.grid[x][y] = { type: tool };
                notify(`${b.name} -₹${b.cost}`, "text-[#7C4DFF]");
                updateUI(); saveGame();
            } else {
                notify("NO FUNDS", "text-[#FF5A5E]");
            }
        }

        function nextTurn() {
            let income = 0;
            let pop = 0;
            // Scan Grid
            for(let x=0; x<GRID_SIZE; x++) for(let y=0; y<GRID_SIZE; y++) {
                const cell = state.grid[x][y];
                if(cell) {
                    const b = BUILDINGS[cell.type];
                    if(b) {
                        income += b.income || 0;
                        pop += b.pop || 0;
                    }
                }
            }
            state.money += Math.max(50, income);
            state.pop = pop;
            state.turn++;
            updateUI(); saveGame();
            notify(`WEEK ${state.turn}: +₹${Math.max(50, income)}`, "text-green-400");
        }

        function updateUI() {
            document.getElementById('uiMoney').innerText = state.money.toLocaleString();
            document.getElementById('uiPop').innerText = state.pop;
            document.getElementById('uiTurn').innerText = state.turn;
        }

        function resetCamera() {
            state.camera.x = canvas.width / 2;
            state.camera.y = 150;
        }

        function notify(msg, colorClass) {
            const el = document.createElement('div');
            el.className = `glass px-4 py-2 text-xs font-bold ${colorClass} animate-bounce text-center`;
            el.innerText = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        // --- 7. SAVE SYSTEM ---
        function saveGame() {
            if(gameId) localStorage.setItem('neo_city_' + gameId, JSON.stringify(state));
        }
        function loadGame() {
            const data = localStorage.getItem('neo_city_' + gameId);
            if(data) state = { ...state, ...JSON.parse(data) };
        }

    </script>
</body>
</html>
